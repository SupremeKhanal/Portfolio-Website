<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>CBT Examination Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
  <style>
    body { background: #020617; }
    .math-content { overflow-x: auto; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "vue": "https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.esm-browser.prod.js",
      "vue-router": "https://cdn.jsdelivr.net/npm/vue-router@4.5.1/dist/vue-router.esm-browser.prod.js"
    }
  }
  </script>
</head>
<body class="font-sans text-slate-200 min-h-screen antialiased">
  <div id="app">
    <p style="text-align:center;padding:4rem;color:#94a3b8;font-size:0.9rem">Loading CBT portal…</p>
  </div>
  <script type="module">
    try {
      await import("./src/main.js");
    } catch (err) {
      const app = document.getElementById("app");
      app.innerHTML = `
        <div style="max-width:32rem;margin:4rem auto;padding:1.5rem;border:1px solid #334155;border-radius:1rem;background:#0f172a;color:#fecaca;font:14px/1.5 Inter,sans-serif">
          <strong>Could not start the CBT app.</strong>
          <p style="margin:0.75rem 0 0;color:#fca5a5">${String(err && err.message ? err.message : err)}</p>
        </div>`;
      console.error(err);
    }
  </script>
</body>
</html>
